<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta
    name="apple-mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

<meta
    name="apple-mobile-web-app-title"
    content="兔飽飽">

<meta
    name="theme-color"
    content="#fff5fa">

<title>豆包 × 兔飽飽</title>


<style>

/* ==================================================
   基本設定
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

    color: #463c4d;

    background:

        radial-gradient(
            circle at 5% 0%,
            #ffe0ec 0,
            transparent 30%
        ),

        radial-gradient(
            circle at 100% 10%,
            #e9ddff 0,
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #fff9fc 0%,
            #f6f1ff 100%
        );

    padding-bottom:
        calc(
            24px +
            env(safe-area-inset-bottom)
        );
}


/* ==================================================
   APP
================================================== */

.app {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding:
        calc(
            14px +
            env(safe-area-inset-top)
        )
        14px
        25px;

}


/* ==================================================
   HEADER
================================================== */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;

}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

}

.logo {

    width: 48px;

    height: 48px;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ffb7d0,
            #d8baff
        );

    box-shadow:
        0 7px 18px
        rgba(210,150,190,.20);

    font-size: 25px;

}

.brand-text h1 {

    margin: 0;

    font-size: 19px;

    font-weight: 900;

}

.brand-text p {

    margin: 3px 0 0;

    font-size: 11px;

    color: #9b8d9f;

}

.header-bunny {

    font-size: 31px;

}


/* ==================================================
   今日粉絲天數
================================================== */

.day-card {

    position: relative;

    overflow: hidden;

    padding:
        19px
        19px
        18px;

    border-radius: 26px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.95),
            rgba(255,238,247,.95)
        );

    box-shadow:
        0 12px 30px
        rgba(180,140,175,.16);

    border:
        1px solid
        rgba(255,255,255,.9);

}

.day-card::before {

    content: "";

    position: absolute;

    width: 130px;

    height: 130px;

    right: -45px;

    top: -50px;

    border-radius: 50%;

    background: #ffd5e6;

    opacity: .55;

}

.day-card::after {

    content: "";

    position: absolute;

    width: 90px;

    height: 90px;

    left: -45px;

    bottom: -45px;

    border-radius: 50%;

    background: #e5d9ff;

    opacity: .55;

}

.day-card-content {

    position: relative;

    z-index: 2;

}

.day-label {

    font-size: 12px;

    color: #94768a;

}

.day-number {

    margin-top: 2px;

    font-size: 47px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: -2px;

    background:
        linear-gradient(
            135deg,
            #ed75a7,
            #9e70df
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}

.day-description {

    margin-top: 4px;

    font-size: 13px;

    font-weight: 700;

    color: #655768;

}

.start-date {

    margin-top: 7px;

    font-size: 10px;

    color: #a092a2;

}


/* ==================================================
   下一個里程碑
================================================== */

.next-box {

    margin-top: 10px;

    padding:
        12px
        14px;

    border-radius: 17px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        linear-gradient(
            135deg,
            #fff0f6,
            #f3edff
        );

}

.next-left {

    display: flex;

    align-items: center;

    gap: 9px;

}

.next-icon {

    width: 34px;

    height: 34px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: rgba(255,255,255,.8);

    font-size: 18px;

}

.next-label {

    font-size: 10px;

    color: #9d879a;

}

.next-title {

    margin-top: 2px;

    font-size: 14px;

    font-weight: 900;

    color: #a56c96;

}

.next-right {

    text-align: right;

}

.next-days {

    font-size: 17px;

    font-weight: 900;

    color: #b16fa2;

}

.next-days-label {

    font-size: 9px;

    color: #a193a4;

}


/* ==================================================
   月曆卡片
================================================== */

.calendar-card {

    margin-top: 12px;

    padding: 16px 13px 14px;

    border-radius: 26px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px
        rgba(160,130,170,.13);

    border:
        1px solid
        rgba(255,255,255,.95);

}


/* ==================================================
   月份標題
================================================== */

.calendar-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 13px;

}

.month-title {

    text-align: center;

}

.month-main {

    font-size: 20px;

    font-weight: 900;

    color: #554957;

}

.month-sub {

    margin-top: 2px;

    font-size: 10px;

    color: #aaa0ad;

}

.month-btn {

    width: 38px;

    height: 38px;

    border: none;

    border-radius: 13px;

    background: #f8f1f8;

    color: #806f82;

    font-size: 22px;

    line-height: 1;

}

.month-btn:active {

    transform: scale(.93);

    background: #f1e7f2;

}


/* ==================================================
   星期
================================================== */

.weekdays {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 3px;

    margin-bottom: 4px;

}

.weekday {

    text-align: center;

    font-size: 10px;

    color: #a79ba9;

    padding-bottom: 3px;

}


/* ==================================================
   月曆
================================================== */

.calendar {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 4px;

}

.day {

    min-height: 54px;

    border-radius: 14px;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 13px;

    color: #554a58;

    transition:
        transform .15s ease,
        background .15s ease;

}

.day:active {

    transform: scale(.94);

}

.day.empty {

    visibility: hidden;

}

.day.future {

    color: #cfc7d1;

}


/* ==================================================
   今天
================================================== */

.day.today {

    background: #fff0f6;

    box-shadow:
        inset 0 0 0 2px
        #f3a9c9;

    font-weight: 900;

}

.day.today::before {

    content: "今天";

    position: absolute;

    top: 3px;

    font-size: 7px;

    color: #cf739c;

}


/* ==================================================
   粉絲日
================================================== */

.fan-day-number {

    margin-top: 2px;

    font-size: 8px;

    color: #aaa0ad;

}

.day.future .fan-day-number {

    color: #d6d0d7;

}


/* ==================================================
   50天里程碑
================================================== */

.day.milestone {

    background:
        linear-gradient(
            135deg,
            #ffe0ec,
            #eee3ff
        );

    font-weight: 900;

}

.day.milestone .fan-day-number {

    color: #b56e98;

    font-weight: 900;

}

.day.milestone::after {

    content: "♥";

    position: absolute;

    right: 4px;

    top: 3px;

    font-size: 8px;

    color: #d48caf;

}


/* ==================================================
   週年
================================================== */

.day.anniversary {

    background:
        linear-gradient(
            135deg,
            #ffe8a7,
            #ffd2e5
        );

    box-shadow:
        inset 0 0 0 2px
        #edb15e;

    font-weight: 900;

}

.day.anniversary .fan-day-number {

    color: #a35e6f;

    font-weight: 900;

}

.day.anniversary::after {

    content: "🎂";

    position: absolute;

    right: 3px;

    top: 1px;

    font-size: 9px;

}


/* ==================================================
   圖例
================================================== */

.legend {

    display: flex;

    justify-content: center;

    gap: 13px;

    margin-top: 13px;

    font-size: 9px;

    color: #9b909f;

}

.legend-item {

    display: flex;

    align-items: center;

    gap: 4px;

}

.legend-dot {

    width: 9px;

    height: 9px;

    border-radius: 4px;

}

.legend-today {

    background: #fff0f6;

    border:
        1px solid
        #f3a9c9;

}

.legend-milestone {

    background:
        linear-gradient(
            135deg,
            #ffe0ec,
            #eee3ff
        );

}

.legend-year {

    background:
        linear-gradient(
            135deg,
            #ffe8a7,
            #ffd2e5
        );

}


/* ==================================================
   日期資訊
================================================== */

.selected-card {

    margin-top: 12px;

    padding: 15px;

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #f5f0ff
        );

    text-align: center;

}

.selected-date {

    font-size: 11px;

    color: #9b8e9e;

}

.selected-main {

    margin-top: 4px;

    font-size: 17px;

    font-weight: 900;

    color: #76566f;

}

.selected-sub {

    margin-top: 4px;

    font-size: 11px;

    color: #9a8c9d;

}


/* ==================================================
   里程碑小卡
================================================== */

.mini-milestones {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 12px;

}

.mini-item {

    padding: 11px 5px;

    text-align: center;

    border-radius: 15px;

    background: #faf7fb;

}

.mini-icon {

    font-size: 17px;

}

.mini-number {

    margin-top: 2px;

    font-size: 12px;

    font-weight: 900;

    color: #ae709e;

}

.mini-label {

    margin-top: 2px;

    font-size: 8px;

    color: #a49aa7;

}


/* ==================================================
   底部
================================================== */

.footer {

    padding: 18px 0 0;

    text-align: center;

    color: #aaa0ad;

    font-size: 9px;

}

.footer strong {

    color: #b2779e;

}


/* ==================================================
   飄愛心
================================================== */

.heart {

    position: fixed;

    pointer-events: none;

    z-index: 100;

    animation:
        floatUp 4s linear forwards;

}

@keyframes floatUp {

    0% {

        transform:
            translateY(0)
            scale(.8);

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    100% {

        transform:
            translateY(-180px)
            scale(1.25);

        opacity: 0;

    }

}


/* ==================================================
   iPhone 小螢幕
================================================== */

@media (max-width: 370px) {

    .app {

        padding-left: 10px;

        padding-right: 10px;

    }

    .day {

        min-height: 48px;

        border-radius: 12px;

    }

    .day-number {

        font-size: 43px;

    }

    .calendar-card {

        padding-left: 9px;

        padding-right: 9px;

    }

}


/* ==================================================
   橫向／大螢幕
================================================== */

@media (min-width: 600px) {

    body {

        padding-top: 20px;

    }

    .app {

        max-width: 560px;

    }

}

</style>

</head>

<div class="app">


    <!-- =========================================

    <header class="header">

            <div class="brand-text">

<script>


/* ==================================================
   基本設定
================================================== */


const startDate =
    new Date(
        "2026-08-04T00:00:00"
    );


const MILESTONE_INTERVAL = 50;

const ANNIVERSARY_INTERVAL = 365;


let currentDate =
    new Date();


let currentYear =
    currentDate.getFullYear();


let currentMonth =
    currentDate.getMonth();


/* ==================================================
   計算粉絲天數
================================================== */

function getFanDay(date) {

    const start =
        new Date(startDate);

    const target =
        new Date(date);

    start.setHours(0,0,0,0);

    target.setHours(0,0,0,0);

    return Math.floor(
        (
            target - start
        ) /
        (
            1000 *
            60 *
            60 *
            24
        )
    ) + 1;

}


/* ==================================================
   判斷週年
================================================== */

function isAnniversary(days) {

    return (
        days > 0 &&
        days % ANNIVERSARY_INTERVAL === 0
    );

}


/* ==================================================
   下一個50天
================================================== */

function getNext50Day(days) {

    let next =
        Math.ceil(
            days /
            MILESTONE_INTERVAL
        )
        *
        MILESTONE_INTERVAL;


    if (
        days %
        MILESTONE_INTERVAL === 0
    ) {

        next +=
            MILESTONE_INTERVAL;

    }


    return next;

}


/* ==================================================
   下一個週年
================================================== */

function getNextAnniversary(days) {

    return (
        Math.floor(
            days /
            ANNIVERSARY_INTERVAL
        ) + 1
    )
    *
    ANNIVERSARY_INTERVAL;

}


/* ==================================================
   更新頂部資訊
================================================== */

function updateMainInfo() {

    const today =
        new Date();

    const days =
        getFanDay(today);


    document.getElementById(
        "fanDay"
    ).textContent =
        days;


    /*
       下一個50天
    */

    const next50 =
        getNext50Day(days);


    /*
       下一個週年
    */

    const nextYear =
        getNextAnniversary(days);


    let nextDay;

    let nextTitle;

    let icon;


    if (
        nextYear <
        next50
    ) {

        nextDay =
            nextYear;

        nextTitle =
            "第 " +
            (
                nextYear /
                ANNIVERSARY_INTERVAL
            ) +
            " 週年";

        icon = "🎂";

    }

    else {

        nextDay =
            next50;

        nextTitle =
            "第 " +
            next50 +
            " 天";

        icon = "💗";

    }


    const remaining =
        nextDay - days;


    document.getElementById(
        "nextIcon"
    ).textContent =
        icon;


    document.getElementById(
        "nextTitle"
    ).textContent =
        nextTitle;


    document.getElementById(
        "remainingDays"
    ).textContent =

        remaining === 0
        ? "就是今天！"
        : "還有 " + remaining + " 天";


    /*
       最近50天
    */

    document.getElementById(
        "milestone50"
    ).textContent =
        next50;


    /*
       再下一個50天
    */

    document.getElementById(
        "milestone100"
    ).textContent =
        next50 + 50;


    /*
       下一個週年
    */

    document.getElementById(
        "nextYear"
    ).textContent =
        nextYear;

}


/* ==================================================
   月曆
================================================== */

function renderCalendar() {


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    /*
       月份標題
    */

    document.getElementById(
        "monthTitle"
    ).textContent =

        currentYear +
        " 年 " +
        (
            currentMonth + 1
        ) +
        " 月";


    /*
       當月第一天星期
    */

    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();


    /*
       當月天數
    */

    const daysInMonth =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    /*
       今天
    */

    const today =
        new Date();


    today.setHours(
        0,0,0,0
    );


    /*
       空白格
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day empty";

        calendar.appendChild(
            empty
        );

    }


    /*
       每一天
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const date =
            new Date(
                currentYear,
                currentMonth,
                day
            );


        date.setHours(
            0,0,0,0
        );


        const fanDay =
            getFanDay(date);


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        /*
           今天
        */

        if (
            date.getTime() ===
            today.getTime()
        ) {

            cell.classList.add(
                "today"
            );

        }


        /*
           未來
        */

        if (
            date > today
        ) {

            cell.classList.add(
                "future"
            );

        }


        /*
           週年
        */

        const anniversary =
            isAnniversary(
                fanDay
            );


        /*
           50天
        */

        const milestone50 =

            fanDay > 0 &&

            fanDay %
            MILESTONE_INTERVAL ===
            0;


        /*
           週年樣式
        */

        if (
            anniversary
        ) {

            cell.classList.add(
                "anniversary"
            );

        }

        /*
           50天樣式
        */

        else if (
            milestone50
        ) {

            cell.classList.add(
                "milestone"
            );

        }


        /*
           日期內容
        */

        let content =

            "<div>" +
            day +
            "</div>";


        /*
           入粉日之後才顯示粉絲天數
        */

        if (
            fanDay >= 1
        ) {

            let symbol = "";

            if (
                anniversary
            ) {

                symbol = " 🎂";

            }

            else if (
                milestone50
            ) {

                symbol = " 💗";

            }


            content +=

                "<div class='fan-day-number'>" +
                fanDay +
                symbol +
                "</div>";

        }


        cell.innerHTML =
            content;


        /*
           點擊日期
        */

        cell.addEventListener(
            "click",
            () => {

                showSelectedDate(
                    date,
                    fanDay
                );

            }
        );


        calendar.appendChild(
            cell
        );

    }

}


/* ==================================================
   點擊日期後顯示資訊
================================================== */

function showSelectedDate(
    date,
    fanDay
) {


    const year =
        date.getFullYear();


    const month =
        date.getMonth() + 1;


    const day =
        date.getDate();


    document.getElementById(
        "selectedDate"
    ).textContent =

        year +
        " 年 " +
        month +
        " 月 " +
        day +
        " 日";


    /*
       還沒入粉
    */

    if (
        fanDay < 1
    ) {

        document.getElementById(
            "selectedMain"
        ).textContent =
            "還沒成為粉絲 🐰";


        document.getElementById(
            "selectedSub"
        ).textContent =
            "2026 年 8 月 4 日才是我們的第一天 💗";


        return;

    }


    /*
       週年
    */

    if (
        isAnniversary(fanDay)
    ) {

        const yearCount =
            fanDay /
            ANNIVERSARY_INTERVAL;


        document.getElementById(
            "selectedMain"
        ).textContent =

            "🎂 第 " +
            yearCount +
            " 週年！";


        document.getElementById(
            "selectedSub"
        ).textContent =

            "豆包 × 兔飽飽，一起走過 " +
            fanDay +
            " 天 💗";


        return;

    }


    /*
       50天
    */

    if (
        fanDay %
        MILESTONE_INTERVAL ===
        0
    ) {

        document.getElementById(
            "selectedMain"
        ).textContent =

            "💗 粉絲第 " +
            fanDay +
            " 天！";


        document.getElementById(
            "selectedSub"
        ).textContent =

            "又完成一個值得收藏的里程碑啦 ✨";


        return;

    }


    /*
       一般日期
    */

    const next50 =
        getNext50Day(fanDay);


    const remaining =
        next50 -
        fanDay;


    document.getElementById(
        "selectedMain"
    ).textContent =

        "粉絲第 " +
        fanDay +
        " 天 💗";


    document.getElementById(
        "selectedSub"
    ).textContent =

        "再 " +
        remaining +
        " 天，就是第 " +
        next50 +
        " 天啦 ✨";

}


/* ==================================================
   月份切換
================================================== */

function changeMonth(
    offset
) {


    currentMonth +=
        offset;


    if (
        currentMonth < 0
    ) {

        currentMonth = 11;

        currentYear--;

    }


    if (
        currentMonth > 11
    ) {

        currentMonth = 0;

        currentYear++;

    }


    renderCalendar();

}


/* ==================================================
   啟動
================================================== */

updateMainInfo();

renderCalendar();


/*
   啟動時直接顯示今天
*/

showSelectedDate(
    new Date(),
    getFanDay(
        new Date()
    )
);


/* ==================================================
   每分鐘更新
================================================== */

setInterval(
    () => {

        updateMainInfo();

        renderCalendar();

    },
    60000
);


/* ==================================================
   飄愛心
================================================== */

function createHeart() {


    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "heart";


    const emojis = [

        "💗",
        "💕",
        "💖",
        "✨",
        "🌸"

    ];


    heart.textContent =

        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    heart.style.left =

        (
            Math.random() *
            100
        ) +
        "vw";


    heart.style.bottom =
        "25px";


    heart.style.fontSize =

        (
            13 +
            Math.random() *
            10
        ) +
        "px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => {

            heart.remove();

        },
        4000
    );

}


setInterval(
    createHeart,
    6500
);
