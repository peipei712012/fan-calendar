<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的粉絲日曆</title>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
  background: #fff7fb;
  color: #444;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #e66a9b;
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 20px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}
.days {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  color: #e66a9b;
}
.days-text {
  text-align: center;
  color: #888;
}
.month-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.month-title button {
  border: none;
  background: #ffe3ee;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 18px;
}
.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  color: #999;
  margin-bottom: 5px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.day {
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 14px;
  position: relative;
}
.today {
  background: #ffe0ed;
  color: #e0528b;
  font-weight: bold;
}
.milestone {
  background: #ffd166;
  color: #7a5200;
  font-weight: bold;
}
.milestone::after {
  content: "♥";
  position: absolute;
  bottom: 1px;
  font-size: 10px;
}
.legend {
  text-align: center;
  font-size: 13px;
  color: #888;
  margin-top: 12px;
}
</style>
</head>
<body>
<div class="container">
  <h1>💗 我的粉絲日曆</h1>
  <div class="subtitle">從 2026 年 8 月 4 日開始</div>
  <div class="card">
    <div class="days" id="days">0</div>
    <div class="days-text">成為粉絲第幾天</div>
  </div>
  <div class="card">
    <div class="month-title">
      <button onclick="changeMonth(-1)">‹</button>
      <strong id="monthTitle"></strong>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="week">
      <div>日</div>
      <div>一</div>
      <div>二</div>
      <div>三</div>
      <div>四</div>
      <div>五</div>
      <div>六</div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="legend">
      💗 今天　　⭐ 100天／200天／300天里程碑
    </div>
  </div>
</div>
<script>
const startDate = new Date("2026-08-04T00:00:00");
let currentDate = new Date();
function calculateDays() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(startDate);
  const difference = today - start;
  const days = Math.floor(difference / 86400000) + 1;
  document.getElementById("days").textContent = days;
}
function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("monthTitle").textContent =
    `${year} 年 ${month + 1} 月`;
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    calendar.appendChild(empty);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "day";
    cell.textContent = day;
    const date = new Date(year, month, day);
    const diff =
      Math.floor(
        (date - startDate) / 86400000
      ) + 1;
    if (
      date.toDateString() ===
      new Date().toDateString()
    ) {
      cell.classList.add("today");
    }
    if (
      diff > 0 &&
      diff % 100 === 0
    ) {
      cell.classList.add("milestone");
      cell.title = `粉絲第 ${diff} 天`;
    }
    calendar.appendChild(cell);
  }
}
function changeMonth(amount) {
  currentDate.setMonth(
    currentDate.getMonth() + amount
  );
  renderCalendar();
}
calculateDays();
renderCalendar();
</script>
</body>
</html>
