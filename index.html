<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粉絲日誌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#f8f4f9;color:#333;padding-bottom:80px;}

/* 愛心飄動動畫 */
.heart{position:fixed;pointer-events:none;animation:float 4s ease-out forwards;z-index:99;}
@keyframes float{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-400px) scale(0.6);}
}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;}
.logo{width:42px;height:42px;border-radius:16px;overflow:hidden;}
.logo img{width:100%;height:100%;object-fit:cover;}

.hero-card{margin:0 20px;border-radius:24px;background:linear-gradient(135deg,#e9d8f4,#f6e8f0);padding:24px;position:relative;box-shadow:0 6px 18px #00000012;}
.hero-character{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;overflow:hidden;}
.hero-character img{width:100%;height:100%;object-fit:cover;}
.hero-card h1{font-size:22px;margin-bottom:8px;}
.hero-card p{color:#666;font-size:14px;line-height:1.6;}

.section{margin:24px 20px;}
.section-title{font-size:18px;margin-bottom:14px;font-weight:600;}
.card-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.small-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 10px #00000008;}

.today-quote{margin:24px 20px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 10px #00000008;}

/* 底部導航 */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px 0;box-shadow:0 -2px 12px #00000008;}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#777;gap:4px;}
.nav-item span{width:21px;height:21px;border-radius:50%;overflow:hidden;display:inline-block;}
.nav-item span img{width:100%;height:100%;object-fit:cover;}
.nav-item.active{color:#b878c7;font-weight:500;}
</style>
</head>
<body>
<!-- 頁首 -->
<header>
  <div class="logo">
    <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/30011001309440489110220400404011~tplv-a9rns2rl98-image.image" alt="頭像">
  </div>
  <div>粉絲日誌</div>
</header>

<!-- Hero主卡片 -->
<div class="hero-card">
  <div class="hero-character">
    <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/30011001309440489110220400404011~tplv-a9rns2rl98-image.image" alt="頭像">
  </div>
  <h1>歡迎來到專屬日誌 ✨</h1>
  <p>記錄每一次相遇、每一個重要里程碑，珍藏所有美好的瞬間。點擊畫面會飄出愛心喔。</p>
</div>

<!-- 里程碑區塊 -->
<div class="section">
  <h2 class="section-title">📌 里程碑</h2>
  <div class="card-wrap">
    <div class="small-card">第一次見面</div>
    <div class="small-card">舞台紀念日</div>
    <div class="small-card">生日</div>
    <div class="small-card">專輯發行</div>
  </div>
</div>

<!-- 今日小語 -->
<div class="today-quote">
  <h3>💌 今日小語</h3>
  <p>保持熱愛，奔赴下一場山海。</p>
</div>

<!-- 底部導航 -->
<nav>
  <div class="nav-item">首頁</div>
  <div class="nav-item active">
    <span>
      <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/30011001309440489110220400404011~tplv-a9rns2rl98-image.image" alt="頭像">
    </span>
    日誌
  </div>
  <div class="nav-item">相簿</div>
  <div class="nav-item">設定</div>
</nav>

<script>
// 點擊飄愛心
document.body.addEventListener('click',(e)=>{
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerText = '❤️';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  heart.style.fontSize = '24px';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
})
</script>
</body>
</html>
